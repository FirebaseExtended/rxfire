name: Format

on:
  pull_request:
  push:
    branches:
      - "**"

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    name: Formatting Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Check formatting
        run: yarn fmt:check
